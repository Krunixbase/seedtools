<?xml version="1.0" encoding="UTF-8"?>
<svg 
    xmlns="http://www.w3.org/2000/svg"
    width="512"
    height="512"
    viewBox="0 0 512 512"
    preserveAspectRatio="xMidYMid">

  <!-- DARK BLUE BACKGROUND -->
  <rect width="100%" height="100%" fill="#0b1f3b"/>

  <!-- ICON -->
  <g stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- OUTER HEXAGON (większy, jak w PNG) -->
    <polygon 
      points="256,190 296,213 296,259 256,282 216,259 216,213" 
      fill="none"/>

    <!-- INNER HEXAGON -->
    <polygon 
      points="256,205 277,217 277,255 256,267 235,255 235,217" 
      fill="none" 
      stroke-width="10"/>

    <!-- TOP BRANCH -->
    <line x1="256" y1="190" x2="256" y2="140"/>
    <rect x="246" y="130" width="20" height="20" fill="#FFFFFF"/>

    <!-- LEFT BRANCH -->
    <line x1="216" y1="213" x2="180" y2="190"/>
    <rect x="170" y="180" width="20" height="20" fill="#FFFFFF"/>

    <!-- RIGHT BRANCH -->
    <line x1="296" y1="213" x2="332" y2="190"/>
    <rect x="322" y="180" width="20" height="20" fill="#FFFFFF"/>

  </g>

  <!-- TEXT (bliżej ikony, jak w PNG) -->
  <text 
    x="50%" 
    y="440" 
    font-family="Arial, sans-serif" 
    font-size="52" 
    fill="#FFFFFF" 
    text-anchor="middle">
    SeedTools
  </text>

</svg>

